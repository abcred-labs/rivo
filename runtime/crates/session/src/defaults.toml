# 模型生命周期（流程见 docs/architecture/model-catalog-lifecycle.md）：
# 1. 计划下线：在 [deprecated_models] 登记并给出 replaced_by，模型仍保留在 [models]，至少保留一个发布版本。
# 2. 正式下线：从 [models] 删除，同时登记到 [retired_models]。墓碑永不删除，客户端据此提示用户清理残留配置。
# replaced_by 必须是未弃用的内置模型；没有明确同系列后继时留空。
