[package]
name = "rivo"
default-run = "rivo"
description = "Rivo —— 通用 Agent CLI"
build = "build.rs"
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "rivo"
path = "src/main.rs"

[[bin]]
name = "rivo-browser-extension-host"
path = "src/browser_extension_host_main.rs"

[dependencies]
async-trait.workspace = true
anyhow.workspace = true
base64.workspace = true
clap.workspace = true
dirs.workspace = true
flate2.workspace = true
futures.workspace = true
fs2.workspace = true
fluent-bundle.workspace = true
hex.workspace = true
rivo-core = { path = "../core" }
rivo-llm = { path = "../llm" }
rivo-a2a = { path = "../a2a" }
rivo-a2a-server = { path = "../a2a-server" }
rivo-instance-control = { path = "../instance-control" }
rivo-i18n = { path = "../i18n" }
rivo-policy = { path = "../policy" }
rivo-session = { path = "../session" }
rivo-storage = { path = "../storage" }
 rivo-telemetry = { path = "../telemetry" }
rivo-tui = { path = "../tui" }
rivo-tools = { path = "../tools" }
crossterm.workspace = true
ratatui.workspace = true
reqwest.workspace = true
rcgen = { version = "0.13", features = ["x509-parser"] }
p256.workspace = true
tokio-rustls = "0.26"
rpassword.workspace = true
serde_json.workspace = true
serde.workspace = true
sha2.workspace = true
tar.workspace = true
tempfile.workspace = true
time.workspace = true
toml.workspace = true
tokio.workspace = true
zip.workspace = true
zeroize.workspace = true
windows-sys = { version = "0.61", features = ["Win32_System_Console", "Win32_Foundation"] }

[build-dependencies]
winresource = "0.1.31"

[dev-dependencies]
async-trait.workspace = true
rivo-core = { path = "../core" }
rivo-test-support = { path = "../test-support" }
portable-pty = "0.9"
serde_json.workspace = true
tempfile.workspace = true
rusqlite.workspace = true
vt100 = "0.16"
