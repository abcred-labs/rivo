name: Bug report
description: Report a reproducible problem in Rivo.
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please remove API keys, credentials, session databases, and user data before submitting.
  - type: input
    id: version
    attributes:
      label: Rivo version
      placeholder: 0.1.0
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Windows amd64
        - Linux amd64
        - Linux arm64
        - macOS amd64
        - macOS arm64
        - Other
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include the smallest safe command or configuration that reproduces the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Safe logs
      description: Redact secrets and personal data. `rivo diagnostics create` can produce a bounded report.
      render: text
