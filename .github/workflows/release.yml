name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Candidate version (major.minor.patch); creates a draft only'
        required: true
        default: '0.1.0'

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  version:
    name: Resolve release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Validate candidate version
        id: release
        env:
          INPUT_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          version="${INPUT_VERSION:-${GITHUB_REF_NAME#v}}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected major.minor.patch; got $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Refuse replacing a published version
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import json, os, urllib.error, urllib.request
          url = f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/releases/tags/v{os.environ['RELEASE_VERSION']}"
          request = urllib.request.Request(url, headers={
              "Authorization": "Bearer " + os.environ["GH_TOKEN"],
              "Accept": "application/vnd.github+json",
              "User-Agent": "rivo-release-guard",
          })
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  release = json.load(response)
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise
          else:
              if not release["draft"]:
                  raise SystemExit("Published versions are immutable; choose a new version")

  verify:
    name: Verify release source
    uses: ./.github/workflows/ci.yml

  package:
    name: Package ${{ matrix.platform }}-${{ matrix.arch }}
    needs: [version, verify]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            arch: amd64
            binary: runtime/target/release/rivo.exe
          - os: ubuntu-latest
            platform: linux
            arch: amd64
            binary: runtime/target/release/rivo
          - os: ubuntu-24.04-arm
            platform: linux
            arch: arm64
            binary: runtime/target/release/rivo
          - os: macos-15-intel
            platform: macos
            arch: amd64
            binary: runtime/target/release/rivo
          - os: macos-latest
            platform: macos
            arch: arm64
            binary: runtime/target/release/rivo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.x'
      - name: Build release binaries
        working-directory: runtime
        env:
          RIVO_RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: cargo build --release --locked
      - name: Package archive and run extracted binaries
        env:
          VERSION: ${{ needs.version.outputs.version }}
        shell: bash
        run: |
          python scripts/package.py --binary "${{ matrix.binary }}" --version "$VERSION" --platform "${{ matrix.platform }}" --arch "${{ matrix.arch }}" --commit "$GITHUB_SHA" --out artifacts/release
          python scripts/release_manifest.py --directory artifacts/release --version "$VERSION" --platform "${{ matrix.platform }}" --arch "${{ matrix.arch }}" --commit "$GITHUB_SHA"
          python scripts/release_smoke.py --directory artifacts/release --version "$VERSION" --platform "${{ matrix.platform }}" --arch "${{ matrix.arch }}" --report "artifacts/release/smoke-${{ matrix.platform }}-${{ matrix.arch }}.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            artifacts/release/*.zip
            artifacts/release/*.tar.gz
            artifacts/release/*.sha256
            artifacts/release/*.json
          if-no-files-found: error

  publish:
    name: Prepare draft GitHub Release
    needs: [version, package]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          path: artifacts/release-assets
          merge-multiple: true
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Rivo ${{ needs.version.outputs.version }}
          draft: true
          make_latest: false
          body_path: CHANGELOG.md
          files: |
            artifacts/release-assets/*.zip
            artifacts/release-assets/*.tar.gz
            artifacts/release-assets/*.sha256
            artifacts/release-assets/*.json
          fail_on_unmatched_files: true
