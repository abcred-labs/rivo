name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  verify:
    name: Verify release source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Resolve release version
        id: release
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must be v<major>.<minor>.<patch>; got $GITHUB_REF_NAME" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Format
        working-directory: runtime
        run: cargo fmt --all -- --check
      - name: Clippy
        working-directory: runtime
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        working-directory: runtime
        run: cargo test --workspace --all-targets --locked
      - name: Repository checks
        run: |
          python -m compileall -q scripts packaging
          python scripts/check_markdown_links.py
          python scripts/package-test.py

  package:
    name: Package ${{ matrix.platform }}-${{ matrix.arch }}
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            arch: amd64
            binary: runtime/target/release/rivo.exe
          - os: ubuntu-latest
            platform: linux
            arch: amd64
            binary: runtime/target/release/rivo
          - os: ubuntu-24.04-arm
            platform: linux
            arch: arm64
            binary: runtime/target/release/rivo
          - os: macos-15-intel
            platform: macos
            arch: amd64
            binary: runtime/target/release/rivo
          - os: macos-latest
            platform: macos
            arch: arm64
            binary: runtime/target/release/rivo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Resolve release version
        id: release
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must be v<major>.<minor>.<patch>; got $GITHUB_REF_NAME" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build release binary
        working-directory: runtime
        env:
          RIVO_RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: cargo build --release --locked
      - name: Package archive
        env:
          VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          version="$VERSION"
          python scripts/package.py \
            --binary "${{ matrix.binary }}" \
            --version "$version" \
            --platform "${{ matrix.platform }}" \
            --arch "${{ matrix.arch }}" \
            --commit "${GITHUB_SHA}" \
            --out release
          python scripts/release_manifest.py \
            --directory release \
            --version "$version" \
            --platform "${{ matrix.platform }}" \
            --arch "${{ matrix.arch }}" \
            --commit "${GITHUB_SHA}"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            release/*.zip
            release/*.tar.gz
            release/*.sha256
            release/*.json
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: package
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/*.zip
            release-assets/*.tar.gz
            release-assets/*.sha256
            release-assets/*.json
          fail_on_unmatched_files: true
          generate_release_notes: true
