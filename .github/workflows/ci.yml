name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  msrv:
    name: Rust 1.88 minimum version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install minimum toolchain
        run: rustup toolchain install 1.88.0 --profile minimal
      - name: Linux build prerequisites
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - name: Check minimum supported Rust
        working-directory: runtime
        run: cargo +1.88.0 check --workspace --exclude xtask --all-targets --locked

  dependencies:
    name: Dependency security and licenses
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2
        with:
          tool: cargo-about@0.9.2,cargo-audit@0.22.2
      - name: Install checksum-pinned security and workflow tools
        run: python scripts/install_ci_tools.py
      - name: Secret history and workflow checks
        run: |
          gitleaks git --redact=100 --no-banner --log-opts=--all
          actionlint
      - name: RustSec (including unsound, unmaintained and yanked dependencies)
        run: cargo audit --file runtime/Cargo.lock --deny warnings
      - name: Complete, current dependency notices
        run: python scripts/generate_licenses.py --check

  quality:
    name: Quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-15]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Linux build prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - name: Format
        working-directory: runtime
        run: cargo fmt --all -- --check
      - name: Clippy
        working-directory: runtime
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Build
        working-directory: runtime
        run: cargo build --workspace --all-targets --locked
      - name: Test
        working-directory: runtime
        run: cargo test --workspace --all-targets --locked
      - name: Markdown links
        run: python scripts/check_markdown_links.py
      - name: Python checks
        run: |
          python -m compileall -q scripts packaging
          python scripts/package-test.py
          python scripts/check_browser_extension.py
      - name: Browser extension tests
        run: node --test packaging/browser-extension/tests/content-script.test.mjs packaging/browser-extension/tests/service-worker.test.mjs
